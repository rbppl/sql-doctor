<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Developer Doctor scans GitHub repositories for actionable developer, SQL, Docker and configuration issues.">
<title>Developer Doctor — GitHub code health</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
*{box-sizing:border-box}body{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
button,select{font:inherit}button{padding:10px 16px;cursor:pointer;border:0;border-radius:9px;background:#111827;color:#fff;font-weight:600}button:disabled{opacity:.6;cursor:wait}
select{padding:11px;width:100%;border:1px solid #d1d5db;border-radius:9px;background:#fff}
.header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand h1{margin:0 0 4px;font-size:30px}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 2px 6px #00000008}.wide{grid-column:1/-1}
.stat{font-size:30px;font-weight:750}.small{font-size:13px}.error{color:#b91c1c}.success{color:#166534}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select{flex:1;min-width:220px}
.score{display:flex;align-items:center;gap:20px}.score-number{font-size:48px;font-weight:800;line-height:1}.score-label{font-weight:700}
.finding{border-top:1px solid #eee;padding:14px 0}.finding:first-child{border-top:0}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e5e7eb;font-size:12px;font-weight:700;margin-right:8px;text-transform:uppercase}
.history-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #eee;font-size:14px}
a{color:#2563eb;text-decoration:none}@media(max-width:720px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.header{align-items:flex-start}.score{align-items:flex-start}}
footer{margin-top:32px;padding:20px 0;border-top:1px solid #d1d5db;display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><h1>Developer Doctor</h1><div class="muted">GitHub code health checks for developers.</div></div>
  <button id="logout" hidden>Log out</button>
</header>
<main id="app"></main>\n<footer aria-label="Legal and service information"><a href="/imprint.html">Imprint / Impressum</a><a href="/privacy.html">Privacy / Datenschutz</a><a href="/terms.html">Terms / Nutzungsbedingungen</a><a href="/imprint.html">Contact details</a><span class="muted">Static analysis only — review all findings.</span></footer>
<script>
const API="https://developer-doctor-backend.onrender.com";
const app=document.getElementById("app"),logout=document.getElementById("logout");
async function api(path,opts={}){
  const r=await fetch(API+path,{...opts,credentials:"include",headers:{"Content-Type":"application/json",...(opts.headers||{})}});
  const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{}
  if(!r.ok)throw new Error(d.error||"Request failed");return d;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}

async function loadHistory(){
  const h=await api("/api/history");const box=document.getElementById("history");
  box.innerHTML=h.items.length?h.items.map(x=>'<div class="history-item"><span><strong>'+esc(x.tool)+'</strong> · '+esc(x.result?.score??x.result?.result?.score??"—")+'/100<br><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span></span><button class="history-view" data-id="'+esc(x.id)+'">View</button></div>').join(""):'<div class="muted">No scans yet.</div>';
  for(const button of box.querySelectorAll(".history-view")){
    button.onclick=()=>{const item=h.items.find(x=>String(x.id)===button.dataset.id);if(item)showResult(item.result)};
  }
}
function downloadReport(data){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="developer-doctor-report-"+new Date().toISOString().replace(/[:.]/g,"-")+".json";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function renderResult(data){
  const result=data?.result&&typeof data.result==="object"?data.result:data;
  const score=Number.isFinite(Number(result?.score))?Number(result.score):null;
  const findings=Array.isArray(result?.findings)?result.findings:Array.isArray(result?.issues)?result.issues:[];
  const counts=result?.counts||findings.reduce((out,x)=>{out[x.severity]=(out[x.severity]||0)+1;return out},{});
  const countText=["critical","high","medium","low","info"].filter(k=>counts[k]).map(k=>k+": "+counts[k]).join(" · ")||"No findings";
  const details=findings.length?findings.map(x=>'<div class="finding"><div><span class="badge">'+esc(x.severity||"info")+'</span><strong>'+esc(x.title||x.ruleId||"Finding")+'</strong></div><div>'+esc(x.file||"")+(x.line?':'+esc(x.line):"")+'</div><p>'+esc(x.message||"")+'</p><p class="muted"><strong>Suggested fix:</strong> '+esc(x.fix||"Review the affected code.")+'</p></div>').join(""):'<p class="success">No heuristic issues detected. This is a static analysis result, not a proof of correctness.</p>';
  const meta='<div class="score"><div class="score-number">'+(score===null?"—":esc(score))+'</div><div><div class="score-label">Score / 100</div><div class="muted small">'+esc(result?.summary||"Analysis complete")+'</div><div class="muted small">'+esc(countText)+'</div>'+(result?.filesScanned!==undefined?'<div class="muted small">Files scanned: '+esc(result.filesScanned)+' / '+esc(result.filesConsidered??result.filesScanned)+'</div>':"")+'</div></div>';
  return meta+'<div class="toolbar" style="margin:16px 0"><button id="download-report">Export JSON report</button></div>'+details;
}
function showResult(data){document.getElementById("result").innerHTML=renderResult(data);const button=document.getElementById("download-report");if(button)button.onclick=()=>downloadReport(data)}
async function boot(){
  const q=new URLSearchParams(location.search);
  const oauthCode=q.get("oauth_code");
  if(oauthCode){
    history.replaceState({},document.title,"/");
    try{await api("/api/auth/exchange",{method:"POST",body:JSON.stringify({code:oauthCode})})}
    catch(e){
      app.innerHTML='<section class="card"><h2>GitHub sign-in failed</h2><p class="error">'+esc(e.message)+'</p><a href="'+API+'/api/auth/github"><button>Try again</button></a></section>';
      return;
    }
  }
  try{
    const me=await api("/api/me");logout.hidden=false;
    const [repos,usage]=await Promise.all([api("/api/github/repos"),api("/api/usage")]);
    app.innerHTML='<div class="grid"><section class="card"><div class="muted small">CONNECTED GITHUB</div><h2>@'+esc(me.githubLogin||"connected")+'</h2><div class="muted">Repository access follows your GitHub authorization</div></section><section class="card"><div class="muted small">DAILY USAGE · '+esc(String(usage.plan||"free").toUpperCase())+'</div><div class="stat">'+esc(usage.analyses)+' / '+esc(usage.limit)+'</div><div class="muted">Checks remaining today: '+Math.max(0,usage.limit-usage.analyses)+'</div></section><section class="card"><div class="muted small">PLANS</div><h2>Free · €0</h2><p class="muted">20 checks per day</p><hr><h2>Pro</h2><p class="muted">Up to 1,000 checks per day. Subscription price and billing terms are shown securely at checkout.</p><div class="toolbar"><button id="upgrade" '+(me.plan==="pro"?'hidden':'')+'>Upgrade to Pro</button><button id="manage-billing" '+(!(me.plan==="pro"||["active","trialing","past_due","incomplete"].includes(me.subscriptionStatus))?'hidden':'')+'>Manage subscription</button></div><p id="billing-status" class="muted small"></p></section><section class="card"><div class="muted small">ACCOUNT</div><h2>Delete account</h2><p class="muted">Permanently delete your local account and scan history. Active subscriptions must be cancelled first. Stripe may retain billing records as required by law.</p><button id="delete-account" style="background:#991b1b">Delete my account</button><p id="account-status" class="muted small"></p></section><section class="card wide"><h2>Scan a repository</h2><div class="toolbar"><select id="repo">'+repos.items.map(r=>'<option value="'+esc(r.owner+"/"+r.name)+'">'+esc(r.fullName)+(r.private?" 🔒":"")+'</option>').join("")+'</select><button id="scan">Scan repo</button></div><div class="toolbar" style="margin-top:10px"><select id="pr"><option value="">Select an open PR…</option></select><button id="scanPr" disabled>Scan PR</button></div><p id="status" class="muted"></p></section><section class="card wide"><h2>Latest result</h2><div id="result" class="muted">Select a repository and run a scan.</div></section><section class="card wide"><h2>Recent scans</h2><div id="history">Loading…</div></section></div>';
    await loadHistory();
    const billingStatus=document.getElementById("billing-status");
    document.getElementById("upgrade").onclick=async()=>{
      const button=document.getElementById("upgrade");button.disabled=true;billingStatus.textContent="Opening secure checkout…";
      try{const d=await api("/api/billing/checkout",{method:"POST",body:"{}"});location.assign(d.url)}
      catch(e){billingStatus.textContent=e.message;billingStatus.className="error small"}finally{button.disabled=false}
    };
    document.getElementById("manage-billing").onclick=async()=>{
      const button=document.getElementById("manage-billing");button.disabled=true;billingStatus.textContent="Opening billing portal…";
      try{const d=await api("/api/billing/portal",{method:"POST",body:"{}"});location.assign(d.url)}
      catch(e){billingStatus.textContent=e.message;billingStatus.className="error small"}finally{button.disabled=false}
    };
    document.getElementById("delete-account").onclick=async()=>{
      if(!confirm("Delete your Developer Doctor account and scan history permanently? This cannot be undone."))return;
      const button=document.getElementById("delete-account"),status=document.getElementById("account-status");
      button.disabled=true;status.textContent="Deleting account…";
      try{await api("/api/account/delete",{method:"POST",body:"{}"});status.textContent="Account deleted. Signing out…";setTimeout(()=>location.assign("/"),700)}
      catch(e){status.textContent=e.message;status.className="error small";button.disabled=false}
    };
    const billingParams=new URLSearchParams(location.search),billingResult=billingParams.get("billing");
    if(billingResult){billingParams.delete("billing");history.replaceState({},document.title,location.pathname+(billingParams.toString()?"?"+billingParams.toString():"")+location.hash)}
    if(billingResult==="success"){billingStatus.textContent="Checkout complete. Your plan updates after Stripe confirms the subscription; refresh in a moment.";billingStatus.className="success small";setTimeout(()=>location.reload(),2500)}
    else if(billingResult==="cancelled"){billingStatus.textContent="Checkout cancelled. Your plan has not changed."}
    async function loadPrs(){
      const [owner,repo]=document.getElementById("repo").value.split("/");
      const select=document.getElementById("pr"),button=document.getElementById("scanPr");
      select.innerHTML='<option value="">Loading open PRs…</option>';button.disabled=true;
      try{
        const d=await api("/api/github/prs?owner="+encodeURIComponent(owner)+"&repo="+encodeURIComponent(repo));
        select.innerHTML='<option value="">Select an open PR…</option>'+d.items.map(p=>'<option value="'+esc(p.number)+'">#'+esc(p.number)+' '+esc(p.title)+'</option>').join("");
      }catch(e){select.innerHTML='<option value="">Could not load PRs</option>'}
    }
    document.getElementById("repo").onchange=loadPrs;
    document.getElementById("pr").onchange=()=>{document.getElementById("scanPr").disabled=!document.getElementById("pr").value};
    await loadPrs();
    document.getElementById("scanPr").onclick=async()=>{
      const [owner,repo]=document.getElementById("repo").value.split("/"),number=Number(document.getElementById("pr").value),btn=document.getElementById("scanPr"),st=document.getElementById("status");
      btn.disabled=true;st.className="muted";st.textContent="Scanning pull request…";
      try{const d=await api("/api/github/scan-pr",{method:"POST",body:JSON.stringify({owner,repo,number})});showResult(d);st.textContent="PR scan completed.";st.className="success";await loadHistory()}
      catch(e){st.textContent=e.message;st.className="error"}finally{btn.disabled=false}
    };
    document.getElementById("scan").onclick=async()=>{
      const [owner,repo]=document.getElementById("repo").value.split("/"),btn=document.getElementById("scan"),st=document.getElementById("status");
      btn.disabled=true;st.className="muted";st.textContent="Scanning repository…";
      try{const d=await api("/api/github/scan",{method:"POST",body:JSON.stringify({owner,repo})});showResult(d);st.textContent="Scan completed.";st.className="success";await loadHistory()}
      catch(e){st.textContent=e.message;st.className="error"}finally{btn.disabled=false}
    };
  }catch(e){
    logout.hidden=true;
    app.innerHTML='<section class="card"><h2>Connect GitHub</h2><p class="muted">Developer Doctor checks repositories your GitHub authorization permits it to read. Private repository access depends on the granted permissions. Your GitHub token is never exposed to the browser.</p><a href="'+API+'/api/auth/github"><button>Continue with GitHub</button></a></section>';
  }
}
logout.onclick=async()=>{try{await api("/api/auth/logout",{method:"POST"})}finally{location.reload()}};
boot();
</script>
</body>
</html>
