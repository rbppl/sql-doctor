<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Developer Doctor</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px}button{padding:10px 16px;cursor:pointer}select{padding:10px;width:100%;margin:12px 0}pre{background:#f4f4f4;padding:16px;overflow:auto}.card{border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}</style></head><body><h1>Developer Doctor</h1><p>Scan your GitHub repositories for developer issues.</p><div id="app"></div><script>
const API="https://developer-doctor-backend.onrender.com";const app=document.getElementById("app");
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{}),...(localStorage.token?{Authorization:"Bearer "+localStorage.token}:{})}});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d}
async function boot(){const q=new URLSearchParams(location.search);const code=q.get("oauth_code");if(code){const d=await api("/api/auth/exchange",{method:"POST",body:JSON.stringify({code})});localStorage.token=d.token;history.replaceState({},document.title,"/")}if(!localStorage.token){app.innerHTML='<div class="card"><a href="'+API+'/api/auth/github"><button>Continue with GitHub</button></a></div>';return}try{const me=await api("/api/me");const repos=await api("/api/github/repos");app.innerHTML='<div class="card"><b>GitHub:</b> @'+(me.githubLogin||"connected")+'</div><div class="card"><h2>Select repository</h2><select id="repo">'+repos.items.map(r=>'<option value="'+r.owner+'/'+r.name+'">'+r.fullName+(r.private?" 🔒":"")+'</option>').join("")+'</select><button id="scan">Scan repository</button><p id="status"></p></div><div class="card"><h2>Result</h2><pre id="result">Nothing scanned yet.</pre></div>';document.getElementById("scan").onclick=async()=>{const [owner,repo]=document.getElementById("repo").value.split("/");const st=document.getElementById("status");st.textContent="Scanning…";try{const d=await api("/api/github/scan",{method:"POST",body:JSON.stringify({owner,repo})});document.getElementById("result").textContent=JSON.stringify(d,null,2);st.textContent="Done."}catch(e){st.textContent=e.message}}}catch(e){localStorage.removeItem("token");app.innerHTML="<p>Session expired. <a href='"+API+"/api/auth/github'>Sign in again</a>.</p>"}}boot();
</script></body></html>
