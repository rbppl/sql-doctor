name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "developer-backend/**"
      - "frontend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "developer-backend/**"
      - "frontend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doctor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: developer-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax checks
        run: npm run check
      - name: Frontend inline JavaScript syntax
        run: node -e 'const fs=require("node:fs"); const html=fs.readFileSync("../frontend/index.html","utf8"); const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]; if (!scripts.length) throw new Error("No inline scripts found"); scripts.forEach((m,i)=>{ try { new Function(m[1]); } catch (e) { console.error("Inline script "+(i+1)+" syntax error"); throw e; } }); console.log("Frontend inline JavaScript syntax passed");'
      - name: Smoke and regression tests
        run: npm test
      - name: PostgreSQL migration integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/doctor_test
        run: npm run test:db
