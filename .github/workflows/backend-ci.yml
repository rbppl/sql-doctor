name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "developer-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "developer-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: developer-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax checks
        run: npm run check
      - name: Smoke and crypto tests
        run: npm test
