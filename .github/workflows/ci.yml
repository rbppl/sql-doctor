name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doctor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doctor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install
      - name: Validate MCP server syntax
        run: npm run check
      - name: Install backend dependencies
        working-directory: developer-backend
        run: npm install
      - name: Validate backend syntax
        working-directory: developer-backend
        run: npm run check
      - name: Run backend regression tests
        working-directory: developer-backend
        run: npm test
      - name: Run PostgreSQL migration integration tests
        working-directory: developer-backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/doctor_test
        run: npm run test:db
