services:
  - type: web
    name: developer-doctor-backend
    runtime: node
    region: frankfurt
    plan: free
    healthCheckPath: /health
    buildCommand: cd developer-backend && npm install
    startCommand: cd developer-backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: developer-doctor-db
          property: connectionString
      - key: PRO_DAILY_LIMIT
        value: "1000"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MONITORING_BEARER_TOKEN
        sync: false
      - key: BACKUP_S3_URI
        sync: false

  - type: web
    name: developer-doctor-frontend
    runtime: static
    buildCommand: echo "static frontend"
    staticPublishPath: frontend

databases:
  - name: developer-doctor-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 18
